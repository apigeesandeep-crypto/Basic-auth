name: Apigee CI/CD Deployment

on:
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  lint-bundle-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Apigee lint
        run: npm install -g apigeelint

      - name: Run apigeelint
        run: apigeelint -s ./BasicAuth/apiproxy -f table.js

      - name: Authenticate to Google Cloud via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
          token_format: access_token

      - name: Deploy Apigee proxy with Maven
        working-directory: ./BasicAuth
        run: |
          mvn clean install -Peval \
            -Dbearer=${{ steps.auth.outputs.access_token }} \
            -Dorg=${{ vars.APIGEE_ORG }} \
            -Denv=${{ vars.APIGEE_ENV }} \
            -Dapigee.options=update \
            -DskipTests